<main class="grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-5 relative overflow-hidden">
  <div class="w-full max-w-xl z-10">

    <div class="glass-card rounded-xl p-8 md:p-12 shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-white/20">
      <!-- Tab Headers (UX Simulation) -->
      <div class="flex space-x-8 mb-10 border-b border-outline-variant/30">
        <button routerLink="/login"
          class="pb-4 border-b-2 border-secondary font-headline-md text-headline-md text-on-surface">Login</button>
        <button routerLink="/register"
          class="pb-4 font-headline-md text-headline-md text-on-surface-variant hover:text-on-surface transition-colors">Register</button>
      </div>
      <!-- Login Form Section -->
      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="submitForm()">


        <div>
          <label class="block font-label-md text-label-md text-on-surface-variant mb-2">Email Address</label>
          <input formControlName="email"
            class="sunken-input w-full px-4 py-3.5 rounded-lg bg-white/50 border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none"
            placeholder="name@luxury.com" type="email">
        </div>
        @if(loginForm.get('email')?.invalid && loginForm.get('email')?.touched){
        <div class="text-red-500 text-sm">
          Please enter a valid email address.
        </div>
        }
        <div>
          <div class="flex justify-between mb-2">
            <label class="block font-label-md text-label-md text-on-surface-variant">Password</label>
            <a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors" routerLink="/forget-password">Forgot
              Password?</a>
          </div>
          <input formControlName="password"
            class="sunken-input w-full px-4 py-3.5 rounded-lg bg-white/50 border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none"
            placeholder="••••••••" type="password">
        </div>
        @if(loginForm.get('password')?.invalid && loginForm.get('password')?.touched){

        <div class="text-red-500 text-sm">
          Password is required.
        </div>
        }



        <!-- <div class="flex items-center">
          <input formControlName="rememberMe" class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember"
            type="checkbox">
          <label class="ml-2 font-label-sm text-label-sm text-on-surface-variant" for="remember">Remember me for 30
            days</label>
        </div> -->
        <button [disabled]="loginForm.invalid" [ngClass]="loginForm.invalid?'bg-gray-700' : 'btn-primary-gradient'"
          class="w-full text-on-primary py-4 rounded-lg font-label-md text-label-md uppercase tracking-widest transition-all"
          type="submit">
          @if(isLoading()){
          <span class="material-symbols-outlined spin-loader"> refresh</span>
          }
          Sign In
        </button>
        @if(errorMessage()){

        <div class="  text-red-500 text-sm">
          {{ errorMessage() }}
        </div>
        }

        <!-- Social Login -->
        <div class="relative py-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-outline-variant/30"></div>
          </div>
          <div class="relative flex justify-center">
            <span class="px-4 bg-transparent text-on-surface-variant font-label-sm text-label-sm">Or continue
              with</span>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <button
            class="flex items-center justify-center px-4 py-3 border border-outline-variant rounded-lg bg-white/40 hover:bg-white/60 transition-all"
            type="button">
            <span class="material-symbols-outlined mr-2 text-on-surface-variant">account_circle</span>
            <span class="font-label-md text-label-sm text-on-surface">Google</span>
          </button>
          <button
            class="w-full btn-primary-gradient text-on-primary py-4 rounded-lg font-label-md text-label-md uppercase tracking-widest transition-all"
            routerLink="/register">
            Sign Up
          </button>
        </div>
      </form>
    </div>

  </div>




</main>
