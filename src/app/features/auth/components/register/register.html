<main
  class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-3 relative overflow-hidden">
  <div class="w-full max-w-xl z-10">

    <div class="mt-12 glass-card rounded-xl p-8 md:p-12 shadow-sm border border-white/20">
      <h2 class="font-headline-md text-headline-md text-on-surface mb-2">Create Account</h2>
      <p class="font-body-md text-on-surface-variant mb-8">Join the Shopiva tech-luxe collective.</p>
      <form class="space-y-6">
        <div>
          <label class="block font-label-md text-label-md text-on-surface-variant mb-2">Full Name</label>
          <input
            class="sunken-input w-full px-4 py-3.5 rounded-lg bg-white/50 border border-outline-variant outline-none"
            placeholder="Julian Vane" type="text">
        </div>
        <div>
          <label class="block font-label-md text-label-md text-on-surface-variant mb-2">Email Address</label>
          <input
            class="sunken-input w-full px-4 py-3.5 rounded-lg bg-white/50 border border-outline-variant outline-none"
            placeholder="julian@luxury.com" type="email">
        </div>
        <div>
          <label class="block font-label-md text-label-md text-on-surface-variant mb-2">Create Password</label>
          <input
            class="sunken-input w-full px-4 py-3.5 rounded-lg bg-white/50 border border-outline-variant outline-none"
            placeholder="••••••••" type="password">
        </div>
        <div class="flex items-start">
          <input class="mt-1 w-4 h-4 rounded border-outline-variant text-secondary" id="terms" type="checkbox">
          <label class="ml-2 font-label-sm text-label-sm text-on-surface-variant leading-relaxed" for="terms">
            I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a
              class="text-primary hover:underline" href="#">Privacy Policy</a>, including global shipping standards.
          </label>
        </div>
        <button
          class="w-full btn-primary-gradient text-on-primary py-4 rounded-lg font-label-md text-label-md uppercase tracking-widest"
          type="submit">
          Register Now
        </button>
      </form>
    </div>
  </div>
</main>
