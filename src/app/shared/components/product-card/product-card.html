<div class="glass-surface p-4 rounded-lg flex flex-col group active:scale-95 transition-all">
  <div class="aspect-square rounded-lg overflow-hidden mb-6 relative">
    <img
      [src]="product.imageUrls[0]"
      [alt]="product.name"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
    />
    <span [class]="badgeClass" class="absolute top-4 left-4 font-label-sm text-label-sm px-3 py-1 rounded-full">
      {{ product.badge }}
    </span>
  </div>

  <h4 class="font-headline-md text-headline-md text-on-surface px-2">{{ product.name }}</h4>
  <p class="text-on-surface-variant font-body-md text-body-md px-2 mt-2 mb-6">{{ product.description }}</p>

  <div class="mt-auto flex items-center justify-between px-2 pb-2">
    <span class="font-headline-md text-headline-md text-primary">
      {{ product.price | currency }}
    </span>
    <button
      (click)="addToCart()"
      class="bg-surface-container-highest p-3 rounded-full hover:bg-primary hover:text-white transition-colors"
      [attr.aria-label]="'Add ' + product.name + ' to cart'"
    >
      <span class="material-symbols-outlined">add_shopping_cart</span>
    </button>
  </div>
</div>
